<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="35" r="18" fill="#10b981"/>
  <text x="45" y="41" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">⚖️</text>
  <text x="75" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">AAK Exam — Model Evaluation Table: Suggested vs Teacher Assigned Marks</text>
  <rect x="980" y="20" width="180" height="32" rx="8" fill="#065f46" stroke="#059669" stroke-width="1"/>
  <text x="1070" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Random Forest Regressor (N=150)</text>

  <!-- Metrics Bar -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="260" height="85" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" font-weight="bold">MEAN ABSOLUTE ERROR (MAE)</text>
    <text x="20" y="62" font-family="system-ui, sans-serif" font-size="28" fill="#10b981" font-weight="bold">0.42 Marks</text>

    <rect x="285" y="0" width="260" height="85" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="305" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" font-weight="bold">R² GOODNESS OF FIT</text>
    <text x="305" y="62" font-family="system-ui, sans-serif" font-size="28" fill="#6366f1" font-weight="bold">0.912</text>

    <rect x="570" y="0" width="260" height="85" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="590" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" font-weight="bold">AGREEMENT WITHIN ±1.0 MARK</text>
    <text x="590" y="62" font-family="system-ui, sans-serif" font-size="28" fill="#38bdf8" font-weight="bold">94.8%</text>

    <rect x="855" y="0" width="265" height="85" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="875" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" font-weight="bold">DATASET SIZE</text>
    <text x="875" y="62" font-family="system-ui, sans-serif" font-size="28" fill="#f59e0b" font-weight="bold">150 Samples</text>
  </g>

  <!-- Evaluation Comparison Table -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="1120" height="465" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">Held-Out Test Sample Predictions vs Teacher-Assigned Truth Marks</text>
    <text x="24" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Formula: Diff = Suggested Score − Teacher Score • Immutably tracks teacher oversight and overrides</text>

    <!-- Table Header -->
    <rect x="20" y="65" width="1080" height="35" rx="6" fill="#0f172a"/>
    <text x="35" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">ID</text>
    <text x="100" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">STUDENT DESCRIPTIVE ANSWER EXCERPT</text>
    <text x="560" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">LENGTH</text>
    <text x="640" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">KEYWORDS</text>
    <text x="760" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">SUGGESTED</text>
    <text x="870" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">TEACHER</text>
    <text x="960" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">DIFF</text>
    <text x="1030" y="87" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">STATUS</text>

    <!-- Row 1 -->
    <rect x="20" y="105" width="1080" height="48" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="35" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">#001</text>
    <text x="100" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Liskov Substitution Principle mandates subtypes must substitute base types without altering program correctness...</text>
    <text x="560" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">248 ch</text>
    <text x="640" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-weight="bold">92%</text>
    <text x="780" y="134" font-family="system-ui, sans-serif" font-size="13" fill="#818cf8" font-weight="bold">9.0 / 10</text>
    <text x="890" y="134" font-family="system-ui, sans-serif" font-size="13" fill="#34d399" font-weight="bold">9.0 / 10</text>
    <text x="975" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">0.0</text>
    <rect x="1025" y="118" width="65" height="22" rx="6" fill="#065f46"/><text x="1057" y="133" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Exact</text>

    <!-- Row 2 -->
    <rect x="20" y="157" width="1080" height="48" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="35" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">#002</text>
    <text x="100" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Gradient descent adjusts parameters via negative gradient: theta := theta - alpha * nabla J(theta). Learning rate alpha controls step size...</text>
    <text x="560" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">310 ch</text>
    <text x="640" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-weight="bold">88%</text>
    <text x="780" y="186" font-family="system-ui, sans-serif" font-size="13" fill="#818cf8" font-weight="bold">8.5 / 10</text>
    <text x="890" y="186" font-family="system-ui, sans-serif" font-size="13" fill="#34d399" font-weight="bold">8.0 / 10</text>
    <text x="975" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">+0.5</text>
    <rect x="1025" y="170" width="65" height="22" rx="6" fill="#065f46"/><text x="1057" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Agreed</text>

    <!-- Row 3 -->
    <rect x="20" y="209" width="1080" height="48" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="35" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">#003</text>
    <text x="100" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Random Forest creates multiple bootstrap trees and aggregates predictions via majority vote, preventing overfitting...</text>
    <text x="560" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">264 ch</text>
    <text x="640" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-weight="bold">85%</text>
    <text x="780" y="238" font-family="system-ui, sans-serif" font-size="13" fill="#818cf8" font-weight="bold">8.0 / 10</text>
    <text x="890" y="238" font-family="system-ui, sans-serif" font-size="13" fill="#34d399" font-weight="bold">8.5 / 10</text>
    <text x="975" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">-0.5</text>
    <rect x="1025" y="222" width="65" height="22" rx="6" fill="#065f46"/><text x="1057" y="237" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Agreed</text>

    <!-- Row 4 -->
    <rect x="20" y="261" width="1080" height="48" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="35" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">#004</text>
    <text x="100" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Third Normal Form requires relations to be in 2NF and have no transitive dependencies between non-prime attributes...</text>
    <text x="560" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">182 ch</text>
    <text x="640" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#f59e0b" font-weight="bold">68%</text>
    <text x="780" y="290" font-family="system-ui, sans-serif" font-size="13" fill="#818cf8" font-weight="bold">6.5 / 10</text>
    <text x="890" y="290" font-family="system-ui, sans-serif" font-size="13" fill="#34d399" font-weight="bold">6.0 / 10</text>
    <text x="975" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">+0.5</text>
    <rect x="1025" y="274" width="65" height="22" rx="6" fill="#065f46"/><text x="1057" y="289" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Agreed</text>

    <!-- Row 5 -->
    <rect x="20" y="313" width="1080" height="48" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="35" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">#005</text>
    <text x="100" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">Discriminant D = b^2 - 4ac determines nature of roots. If D &lt; 0 roots are complex conjugates, not no solution...</text>
    <text x="560" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">220 ch</text>
    <text x="640" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-weight="bold">90%</text>
    <text x="780" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#818cf8" font-weight="bold">8.5 / 10</text>
    <text x="890" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#34d399" font-weight="bold">9.0 / 10</text>
    <text x="975" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">-0.5</text>
    <rect x="1025" y="326" width="65" height="22" rx="6" fill="#065f46"/><text x="1057" y="341" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Agreed</text>
  </g>
</svg>